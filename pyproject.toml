[project]
name = "railnet"
version = "1.0.0"
description = "Gleisnetz aus OpenStreetMap für die Reiseanzeige (Home Assistant)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["osmium>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
